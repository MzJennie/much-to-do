services:
  backend:
    build: .
    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      - PORT=8080
      - MONGO_URI=mongodb://mongo:27017/much_todo_db
      - DB_NAME=much_todo_db
      - JWT_SECRET_KEY=super-secret-key-change-in-production
      - JWT_EXPIRATION_HOURS=72
      - LOG_LEVEL=DEBUG
      - LOG_FORMAT=json

    depends_on:
      - mongo

    restart: unless-stopped

  mongo:
    image: mongo:6.0

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

    restart: unless-stopped

volumes:
  mongo_data:
